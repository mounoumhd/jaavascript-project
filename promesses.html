<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>promesses</title>
</head>
<body>
    <h1>les promesses cést un objet qui relis le code de production (il provoque la promesse )et le code de consommation (consomme et attend la promesse)</h1>
    <p id="demo"></p>
    
  <script>
    function Mydisplayer(somme){
        document.getElementById("demo").innerHTML()=somme
        
    }
    let myPromise=new Promise(function(myResolve,myReject){
        let x=0
        if (x===0) {
            myResolve("ok")
        }
        else{
           myReject("error")
        }
        
    })
    myPromise.then{

        function (value) {
            Mydisplayer(value)
        },
    
        function (error) {
            Mydisplayer(error)
        }
    }
  </script>  
</body>
</html>
